  <circle cx="120" cy="180" r="10" fill="url(#fullGrad)"/>
  <circle cx="200" cy="180" r="10" fill="url(#fullGrad)"/>

  <!-- Wordmark -->
  <text x="160" y="248" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="40" letter-spacing="8" fill="currentColor">
