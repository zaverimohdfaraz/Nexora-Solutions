<svg width="320" height="360" viewBox="0 0 320 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nexora — Connect. Code. Create.">
  <defs>
    <linearGradient id="fullGrad" x1="110" y1="60" x2="210" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
